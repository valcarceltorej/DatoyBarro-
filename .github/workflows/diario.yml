name: Actualización diaria
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python Ingest.py all
        env:
          API_KEY: ${{ secrets.API_KEY }}
      - run: |
          git config user.name "datoybarro-bot"
          git config user.email "bot@users.noreply.github.com"
          git add datoybarro.db data.json
          git commit -m "Datos actualizados" || echo "Sin cambios"
          git push
